<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- nullbase mark — Ø, refined geometric/brutalist construction -->
  <!-- Ring: perfect circle, centerline r=146, stroke=48 -> outer r=170, inner r=122 -->
  <circle cx="200" cy="200" r="146" fill="none" stroke="#0E1013" stroke-width="48"/>

  <!-- Slash: straight rect, flat (square) ends, exact 45deg, same stroke weight as ring -->
  <rect x="-210" y="-24" width="420" height="48" fill="#0E1013"
        transform="translate(200,200) rotate(-45)"/>
</svg>
